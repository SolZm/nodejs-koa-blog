# ============================================================
# solzm.com 博客前端 —— 443 端口
#
# 服务器上的位置：/etc/nginx/conf.d/web-blog-ssl.conf
# ============================================================

server {
    # nginx 1.24 用这种写法。
    # 不要写成 `http2 on;` —— 那是 nginx 1.25.1 才引入的指令，1.24 上会直接报
    # unknown directive "http2"。
    #
    # default_server 是显式声明「没匹配上任何 server_name 的请求交给谁」。
    # 不写的话，nginx 会拿按文件名排序最靠前的那个 443 块顶替，
    # 而 myblog-admin-ssl.conf 恰好排在 web-blog-ssl.conf 前面，
    # 结果不匹配的流量会落到后台登录页——不是错，但不符合预期。
    # 写在这里就是把它变成明确的决定，以后再加多少个 .conf 都不会变。
    #
    # 注意：同一个 地址:端口 上只能有一个 default_server，
    # 两个块都写会导致 nginx 启动失败（a duplicate default server）。
    listen 443 ssl http2 default_server;

    # www 和裸域名都收。证书 SAN 里两个都有，所以都能通过校验。
    server_name www.solzm.com solzm.com;

    # Let's Encrypt 的证书路径是固定的软链，certbot 续期后会原地更新，
    # 所以这里不用改、nginx 也不用重载。
    ssl_certificate     /etc/letsencrypt/live/solzm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solzm.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 和 80 那份共用同一份 location（ACME 验证 / 接口反代 / SSE）
    include /etc/nginx/snippets/blog-locations.conf;

    # ------------------------------------------------------------
    # 【关于 /_nuxt/ 静态资源，这里刻意不做任何处理 —— 别再加了】
    #
    # 2026-10-17 从服务器本机直连实测（绕开外部代理），现状是：
    #   /_nuxt/700f18e.js  →  content-encoding: gzip
    #                          cache-control: public, max-age=31536000
    # 也就是 Nuxt 自己的 serve-static 已经下发了正确且够用的缓存指令，
    # 响应也是它压好的。
    #
    # 曾经试过在这里 add_header 一条 "public, max-age=31536000, immutable"，
    # 实测响应里出现了【两个 Cache-Control 头】（上游一条 + 这里一条），
    # 而唯一的增量只有 immutable —— 边际收益抵不上「响应头重复」这个脏东西。
    #
    # 真要再进一步，正确方向不是加头，而是让 nginx 直接发文件、别走 Node：
    #     location /_nuxt/ {
    #         alias /home/nginx/web-blog/.nuxt/dist/client/;
    #         add_header Cache-Control "public, max-age=31536000, immutable";
    #     }
    # 该目录已确认存在（.nuxt/dist/client/700f18e.js 在），每访问一个静态资源
    # 就省一次 3008 的往返。但它把「部署路径」硬编码进了 nginx，
    # 一旦路径变、静态资源会 404 到白屏 —— 风险和收益要自己权衡。
    # ------------------------------------------------------------

    location / {
        proxy_pass http://127.0.0.1:3008;

        # 让 Nuxt 知道真实的访问域名和协议（不是 127.0.0.1:3008 和 http）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
