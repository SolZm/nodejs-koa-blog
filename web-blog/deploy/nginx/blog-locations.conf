# ============================================================
# solzm.com 博客前端的公共 location
#
# 80 和 443 两个 server 块都 include 这一份，改接口地址只改这里。
# 服务器上的位置：/etc/nginx/snippets/blog-locations.conf
# ============================================================

# ------------------------------------------------------------
# 0) 传输层压缩
#
# 【为什么需要这一段】
# /etc/nginx/nginx.conf 里其实已经有 `gzip on;`（Ubuntu 默认自带），
# 但紧跟其后的 gzip_types 是被注释掉的 —— 也就是只压 text/html 一种。
# 2026-10-17 从服务器本机实测到的现状：
#   · /api/v1/article 返回的 JSON，7530 字节，Content-Encoding 为空（裸传）
#   · 后台 /static/js/app.db1c6a47.js，40365 字节，同样裸传
#   · 而 SSR 出来的 HTML 反而是压过的（吃的是 text/html 那条默认规则）
# 下面把 JS / CSS / JSON / SVG 这些一并纳入压缩范围。
#
# 【为什么写在 snippet 里而不是 nginx.conf 的 http 块】
# gzip_types 是「设置」语义，子上下文会覆盖父上下文，写这里对
# 下面所有 location 都生效（/api/ 那段的 JSON 响应正是受益者）。
# 而 http 块在 /etc/nginx/nginx.conf，不在本仓库的管理范围内 ——
# 仓库只软链 conf.d/ 和 snippets/ 下的文件，写那里换机器就丢了。
#
# 【为什么列表里没有 text/html】
# nginx 文档写明：text/html 无论 gzip_types 怎么写都一定会压。
# 列上它不算错，只是多余。
#
# 【gzip_min_length 1024】
# 太小的响应压完可能反而更大，还白搭 CPU。几百字节的 JSON 不压。
# ------------------------------------------------------------
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;

# ------------------------------------------------------------
# 1) Let's Encrypt 域名验证
#
# 【必须保留在 80 端口那份里】
# certbot 续期时走的是 http://域名/.well-known/acme-challenge/xxx，
# 80 那份一旦只写 return 301，验证请求会被跳转吞掉，三个月后自动续期直接失败。
#
# 【^~ 不能省】
# 它表示「命中这个前缀后不再去匹配正则 location」。
# 有 ^~ 和没有 ^~ 在大多数配置里结果一样，但一旦别处加了正则 location
# （比如 location ~ \.php$ 之类），ACME 就可能在续期时才莫名其妙失败。
# 这里显式钉死优先级。
# ------------------------------------------------------------
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
}

# ------------------------------------------------------------
# 2) AI 问答接口（SSE 流式）
#
# 必须关掉响应缓冲，否则前端会「卡很久然后一次性全出来」，打字机效果失效。
# 实测（2026-10）：首字节 0.97s / 总耗时 5.75s，说明确实是边生成边推送。
#
# 前缀 /api/v1/ai/ 比下面的 /api/ 长，nginx 取最长前缀匹配，天然优先命中这段。
# ------------------------------------------------------------
location /api/v1/ai/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # 【这里必须关 gzip】
    # 上面第 0 段全局开了 gzip，但 gzip 会攒够一个压缩块才往外发，
    # 等于在 proxy_buffering off 之外又加了一层缓冲，打字机效果会退化成
    # 「卡一会儿然后整段冒出来」。SSE 本来就不大，压缩收益可以忽略。
    gzip off;
}

# ------------------------------------------------------------
# 3) 其余业务接口，反代到 Koa 后端
#
# 【端口是 3000，不是 3008】
#   3000 = node-server（Koa + Sequelize + MySQL），业务接口
#   3008 = web-blog（Nuxt SSR），页面
# 写错端口的表现是接口返回 Nuxt 的 404 HTML，而不是 JSON。
#
# 【proxy_pass 末尾不能加斜杠】
#   写成 http://127.0.0.1:3000/ 的话，nginx 会把匹配到的 /api/ 前缀替换掉，
#   /api/v1/article 会变成 /v1/article，后端直接 404。
#   不加斜杠才会原样透传完整路径。
# ------------------------------------------------------------
location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
