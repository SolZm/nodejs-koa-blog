# ============================================================
# solzm.com 博客前端 —— 80 端口
#
# 服务器上的位置：/etc/nginx/conf.d/web-blog.conf
#
# 这里只做一件事：把 http 全部 301 跳到 https。
# 真正的 location（ACME 验证 / 接口反代）抽在同目录的 blog-locations.conf 里，
# 80 和 443 共用，避免改两处。
# ============================================================

server {
    listen 80;
    server_name www.solzm.com solzm.com;

    # 【绝不能删】
    # 里面是 ACME 域名验证 location，certbot 自动续期依赖它。
    # 删了以后 80 只剩下面的 301，续期请求会被跳转吞掉，
    # 表现是「三个月后证书突然过期」，而不是立刻报错。
    include /etc/nginx/snippets/blog-locations.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}
