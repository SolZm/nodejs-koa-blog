# ============================================================
# 后台管理系统 —— 80 端口
#
# 服务器上的位置：/etc/nginx/conf.d/myblog-admin.conf
#
# 这个块同时承担了两个角色：
#   1) 提供 admin.solzm.com 的入口（页面在 443 那块，这里只做跳转）
#   2) 是 80 端口的【默认 server】——没匹配上任何 server_name 的请求都落到这里。
#      所以直接访问裸 IP http://39.106.53.90 进来的也是后台。
#
# 页面本身在同目录的 myblog-admin-ssl.conf（443）。
# 改这里的 location / 之前想清楚：80 一旦 301，后台就只能走 https 了。
# ============================================================

server {
    listen 80;

    #server_name 39.106.53.90;
    server_name admin.solzm.com;

    # Let's Encrypt 验证文件。
    #
    # 必须配在这里，因为 admin.solzm.com 命中的是这个块、不是博客那个块。
    # 扩证书（certbot --expand -d admin.solzm.com）时挑战请求会带着
    # Host: admin.solzm.com 进来，只在博客那份里配是拿不到的。
    #
    # 下面 location / 已经是 301 了，靠 ^~ 的最长前缀优先命中，
    # 验证请求不会被跳转吞掉。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        # 强制走 HTTPS：后台登录会 POST 密码，走明文 HTTP 等于把密码暴露在链路上。
        return 301 https://$host$request_uri;
    }
}
