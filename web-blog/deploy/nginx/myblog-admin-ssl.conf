# ============================================================
# 后台管理系统 —— 443 端口
#
# 服务器上的位置：/etc/nginx/conf.d/myblog-admin-ssl.conf
#
# 证书和博客用的是同一张（solzm.com 那张已经把 admin.solzm.com 扩进去了），
# 所以路径完全一样。
# ============================================================

server {
    # 和博客那份同样的写法。nginx 1.24 不支持 `http2 on;`
    # （那是 1.25.1 才引入的指令），只能用 listen 后面跟 http2。
    listen 443 ssl http2;
    server_name admin.solzm.com;

    ssl_certificate     /etc/letsencrypt/live/solzm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solzm.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 传输层压缩。后台不 include 博客那份 snippet，所以这里单独配一份。
    #
    # 【为什么必须显式配】
    # /etc/nginx/nginx.conf 里虽然有 `gzip on;`，但它下面的 gzip_types
    # 是注释掉的，只压 text/html。实测（2026-10-17）：
    #   · /static/js/app.db1c6a47.js  40365 字节，裸传、无 Content-Encoding
    #   · index.html                  反而是压过的（吃 text/html 默认规则）
    # 也就是说最该压的 JS/CSS 恰好没压。
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    location / {
        root /home/nginx/solzm-admin;
        index index.html index.htm;
        # Vue Router history 模式：直接访问 /dashboard、/article 等深链接时
        # 文件不存在要回落到 index.html，交给前端路由处理。
        try_files $uri $uri/ /index.html;
    }

    # Vite 产物使用 /assets/ 和 content-hash 文件名，可以长期缓存。
    location /assets/ {
        root /home/nginx/solzm-admin;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ------------------------------------------------------------
    # Vue CLI 的构建产物（/static/js/app.a1b2c3d4.js）
    #
    # 文件名带 content-hash，可以长缓存。原来这些请求全部由 location /
    # 处理——静态文件走不走缓存先不说，至少是没有任何缓存指令下发。
    #
    # 【root 为什么要重写一遍】
    # root 目前只写在 location / 里，没有被提到 server 层。
    # location /static/ 是平级的独立块，不继承兄弟 location 的 root，
    # 不写就会落到 nginx 默认的 web 根目录去找文件，直接 404。
    #
    # 【index.html 不在这里】
    # 它没有 hash，必须每次校验，由 location / 处理即可。
    # ------------------------------------------------------------
    location /static/ {
        root /home/nginx/solzm-admin;

        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 后台接口，转发到 Koa 后端（3000）。
    # proxy_pass 末尾不带斜杠，否则会把匹配到的 /api/ 前缀替换掉。
    location /api/ {
        proxy_pass http://127.0.0.1:3000;

        # 后台本身不涉及流式，这三行 keep 着无害，
        # 顺带覆盖万一从后台域名调用 AI 问答的情况。
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}
